name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run android:sync
      - name: Build Debug APK
        run: ./android/gradlew -p android assembleDebug
      - name: Rename APK with version
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "APK_NAME=Superglen-v${VER}.apk" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/debug/app-debug.apk "Superglen-v${VER}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          retention-days: 30
      - name: Publish APK to GitHub Pre-Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            TAG="android-latest"
          fi
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "${APK_NAME}" \
            --prerelease \
            --title "Superglen APK (${APK_NAME})" \
            --notes "APK uji coba offline untuk tablet/HP Android (Android 7.0+). Unduh ${APK_NAME} lalu tap untuk install."
